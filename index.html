<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Campaign Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
    }
    input, textarea, button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 14px;
    }
    button {
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>Email Campaign Generator</h2>

<label>Name:</label>
<input type="text" id="name" placeholder="Your name">

<label>Year:</label>
<input type="text" id="year" placeholder="e.g. 2nd Year">

<label>Degree:</label>
<input type="text" id="degree" placeholder="e.g. BSc Computer Science">

<label>Generated Email:</label>
<textarea id="emailBody" rows="10" readonly></textarea>

<button onclick="generateEmail()">Generate Email</button>
<button onclick="openMailto()">Open in Default Email App</button>
<button onclick="openGmail()">Open in Gmail</button>
<button onclick="copyToClipboard()">Copy to Clipboard</button>

<script>
const recipients = [
  "will.fearn@icloud.com",
  "willfearn05@gmail.com",
  "example3@email.com"
];

function generateEmail() {
  const name = document.getElementById("name").value;
  const year = document.getElementById("year").value;
  const degree = document.getElementById("degree").value;

  const body = `Dear Sir/Madam,

My name is ${name}, and I am currently a ${year} student studying ${degree}.

I am reaching out to express my interest in potential opportunities.

I would greatly appreciate any information you can provide.

Kind regards,
${name}`;

  document.getElementById("emailBody").value = body;
}

function openMailto() {
  const subject = encodeURIComponent("Inquiry from Student");
  const body = encodeURIComponent(document.getElementById("emailBody").value);
  const to = recipients.join(",");

  window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
}

function openGmail() {
  const subject = encodeURIComponent("Inquiry from Student");
  const body = encodeURIComponent(document.getElementById("emailBody").value);
  const to = recipients.join(",");

  const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${subject}&body=${body}`;
  window.open(gmailUrl, "_blank");
}

function copyToClipboard() {
  const text = document.getElementById("emailBody");
  text.select();
  document.execCommand("copy");
  alert("Copied to clipboard!");
}
</script>

</body>
</html>
